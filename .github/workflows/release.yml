name: Release (official = open core + private team overlay)

# The OFFICIAL binary everyone downloads (stable AND pre-release) is the ASSEMBLED
# build: this public core pinned at the release tag + the PRIVATE team overlay
# (SafeClaw-OSS/safeclaw-ee). team-edition §9 (VS Code / Code-OSS model).
#
# Single trigger: a version tag on THIS repo. The overlay repo has no release CI,
# so there is exactly one build per tag (no duplicate). To ship an overlay change,
# cut a new core patch tag; it re-assembles with the overlay's latest main.

on:
  push:
    tags:
      - 'v*'          # stable vX.Y.Z AND pre-release vX.Y.Z-rc.N

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write       # sigstore OIDC — build-provenance attestation
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: safeclaw-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: safeclaw-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: safeclaw-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: safeclaw-macos-aarch64

    steps:
      # We build the PRIVATE overlay crate; its Cargo.toml pins the public core by
      # THIS git tag (below), so cargo fetches the public core itself. No core
      # checkout is needed, and the cross container gets the core from the cargo
      # cache (avoids the path-dep-outside-mount problem).
      #
      # EE_READ_TOKEN = a fine-grained PAT with ONLY `Contents: Read` on
      # SafeClaw-OSS/safeclaw-ee (the org has deploy keys disabled, so a read
      # token is the minimal way for this public repo's CI to fetch the private
      # overlay). Store it in this repo's Actions secrets.
      - name: Checkout private overlay (safeclaw-ee)
        uses: actions/checkout@v4
        with:
          repository: SafeClaw-OSS/safeclaw-ee
          ref: main
          token: ${{ secrets.EE_READ_TOKEN }}
          path: safeclaw-ee

      # Reproducible: pin the core dependency to THIS release tag, replacing the
      # local `path = "../safeclaw"` used for dev. A given tag always assembles the
      # core at that tag + the overlay's main at build time.
      - name: Pin core to the release tag
        run: |
          cd safeclaw-ee
          sed -i -E "s#^safeclaw = .*#safeclaw = { git = \"https://github.com/SafeClaw-OSS/safeclaw\", tag = \"${{ github.ref_name }}\" }#" Cargo.toml
          echo "--- pinned core dep ---"; grep '^safeclaw = ' Cargo.toml
          echo "core=${{ github.ref_name }} overlay=$(git rev-parse HEAD)" > ../assembly.txt

      - name: Record overlay revision (once)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v4
        with:
          name: assembly
          path: assembly.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      # build.rs stamps SC_BUILD_TAG from a `.build-tag` FILE when present; the
      # git-pinned core has none, so we pass the tag via the ambient env instead —
      # `option_env!("SC_BUILD_TAG")` in the core's lib.rs picks it up, so the
      # binary still self-reports vX.Y.Z(-rc.N).
      - name: Build (cross, Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        working-directory: safeclaw-ee
        env:
          SC_BUILD_TAG: ${{ github.ref_name }}
        run: cross build --release --target ${{ matrix.target }} --bin safeclaw

      - name: Build (cargo, native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        working-directory: safeclaw-ee
        env:
          SC_BUILD_TAG: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }} --bin safeclaw

      - name: Rename binary
        run: cp safeclaw-ee/target/${{ matrix.target }}/release/safeclaw ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The service catalog is a pure function of the compiled-in recipes, so the
      # released binary itself renders it offline. Ships `registry.json` as a
      # per-release asset the console fetches — never drifts from this build.
      - name: Render service catalog (registry.json)
        run: |
          chmod +x artifacts/safeclaw-linux-x86_64
          ./artifacts/safeclaw-linux-x86_64 registry --json > artifacts/registry.json
          echo "registry.json services: $(grep -c '\"id\"' artifacts/registry.json)"

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum safeclaw-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'artifacts/safeclaw-*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # Hyphenated tag (v1.2.3-rc.1) = pre-release: GitHub never moves "latest"
          # to it and `sc upgrade` / install.sh (which pull releases/latest) skip
          # it; a bare vX.Y.Z becomes latest. `sc upgrade --pre` opts in. BOTH
          # channels are the assembled official (team) binary.
          prerelease: ${{ contains(github.ref_name, '-') }}
