setup = """
Run the publish under `sc run -- cargo publish`.
Publishing is irreversible (crates.io only yanks) — expect a passkey prompt; the
approve link surfaces in cargo's error output. Tap it, then re-run the command.
"""

[service]
id = "cratesio"
name = "crates.io"
# Classification for browse/filter and policy tag-floors; lowercase-kebab, multi OK.
tags = ["dev"]

hosts = ["crates.io"]
secrets = ["CARGO_REGISTRY_TOKEN"]
# Where a human mints the secret (auxiliary; display-only helper link).
secret_url = "https://crates.io/settings/tokens"
